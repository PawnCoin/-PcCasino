<!DOCTYPE html>
<html>
    <head>
        <title>HORSE RACING</title>
        <link rel="stylesheet" href="css/reset.css" type="text/css">
        <link rel="stylesheet" href="css/main.css" type="text/css">
        <link rel="stylesheet" href="css/orientation_utils.css" type="text/css">
        <link rel="stylesheet" href="css/ios_fullscreen.css" type="text/css">
        <link rel='shortcut icon' type='image/x-icon' href='./favicon.ico' />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui" />
        <meta name="msapplication-tap-highlight" content="no"/>

        <script type="text/javascript" src="js/jquery-3.2.1.min.js"></script>
        <script type="text/javascript" src="js/howler.min.js"></script>
        <script type="text/javascript" src="js/createjs-2015.11.26.min.js"></script>
        <script type="text/javascript" src="js/CLang.min.js"></script>
        <script type="text/javascript" src="js/main.js"></script>

    </head>
    <body ondragstart="return false;" ondrop="return false;" >
        <div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
        <script>
            var _pcUrlBalance = parseInt(new URLSearchParams(window.location.search).get('balance'), 10);
            var _pcStartBalance = isNaN(_pcUrlBalance) ? 1000 : _pcUrlBalance;
            var _pcPrevBalance = _pcStartBalance;
            var _pcGamePhase = 'loading';
            var _pcMenuShown = false;
            var _pcCustomChipValue = null;
            var _pcSceneryFilter = 'none';

            $(document).ready(function () {
                var oMain = new CMain({
                    money: _pcStartBalance,
                    min_bet: 1,
                    max_bet: 1000000000,
                    win_occurrence: 40,
                    game_cash: _pcStartBalance,
                    chip_values: [1, 5, 10, 25, 50, 100],
                    audio_enable_on_startup: false,
                    show_credits: true,
                    fullscreen: true,
                    check_orientation: true,
                    num_levels_for_ads: 2
                });

                $(oMain).on("recharge", function (evt) {
                    window.parent.postMessage({ type: 'getBalance' }, '*');
                    var iMoney = _pcStartBalance;
                    if (typeof s_oBetPanel !== 'undefined' && s_oBetPanel !== null) {
                        s_oBetPanel.setMoney(iMoney);
                    }
                });

                $(oMain).on("start_session", function (evt) {
                    if (_pcGamePhase !== 'betting') {
                        _pcGamePhase = 'betting';
                        window.parent.postMessage({ type: 'hr:phase', phase: 'betting' }, '*');
                    }
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeStartSession();
                    }
                });

                $(oMain).on("end_session", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeEndSession();
                    }
                });

                $(oMain).on("bet_placed", function (evt, iTotBet) {
                    _pcGamePhase = 'racing';
                    window.parent.postMessage({ type: 'hr:phase', phase: 'racing' }, '*');
                    if (window._pcCrowdChants) window._pcCrowdChants.start();
                });

                $(oMain).on("save_score", function (evt, iScore) {
                    _pcGamePhase = 'result';
                    window.parent.postMessage({ type: 'hr:phase', phase: 'result' }, '*');
                    if (window._pcCrowdChants) window._pcCrowdChants.stop();
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeSaveScore({ score: iScore });
                    }
                    var netChange = iScore - _pcPrevBalance;
                    if (netChange > 0) {
                        window.parent.postMessage({ type: 'win', amount: netChange }, '*');
                    } else if (netChange < 0) {
                        window.parent.postMessage({ type: 'bet', amount: Math.abs(netChange) }, '*');
                    }
                    _pcPrevBalance = iScore;

                    setTimeout(function () {
                        _pcAutoReturnToBetting();
                    }, 3000);
                });

                $(oMain).on("show_interlevel_ad", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeShowInterlevelAD();
                    }
                });

                $(oMain).on("share_event", function (evt, iScore) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeShareEvent({
                            img: TEXT_SHARE_IMAGE,
                            title: TEXT_SHARE_TITLE,
                            msg: TEXT_SHARE_MSG1 + iScore + TEXT_SHARE_MSG2,
                            msg_share: TEXT_SHARE_SHARE1 + iScore + TEXT_SHARE_SHARE1
                        });
                    }
                });

                if (isIOS()) {
                    setTimeout(function () {
                        sizeHandler();
                    }, 200);
                } else {
                    sizeHandler();
                }

                _pcPatchContinuousPlay();
                _pcPatchChipSystem();
                _pcReplaceChipSprites();
            });

            function _pcDrawGoldChip(size, ringColor, accentColor) {
                var c = document.createElement('canvas');
                c.width = size; c.height = size;
                var ctx = c.getContext('2d');
                var cx = size / 2, cy = size / 2, r = size / 2 - 1;

                ctx.save();
                var grad = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.1, cx, cy, r);
                grad.addColorStop(0, '#FFE066');
                grad.addColorStop(0.35, '#D4AF37');
                grad.addColorStop(0.7, '#B8860B');
                grad.addColorStop(1, '#8B6914');
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,240,180,0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, r - 3, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = ringColor || 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, r - 6, 0, Math.PI * 2);
                ctx.stroke();

                var notches = 12;
                for (var ni = 0; ni < notches; ni++) {
                    var ang = (ni / notches) * Math.PI * 2;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(ang);
                    ctx.fillStyle = accentColor || 'rgba(255,220,120,0.5)';
                    ctx.fillRect(r - 4, -1.2, 3, 2.4);
                    ctx.restore();
                }

                ctx.font = 'bold ' + Math.round(size * 0.2) + 'px Impact, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillText('$Pc', cx + 0.5, cy + 0.5);
                ctx.fillStyle = '#FFF8DC';
                ctx.fillText('$Pc', cx, cy);

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(139,105,20,0.7)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
                return c;
            }

            function _pcReplaceChipSprites() {
                var chipStyles = [
                    { ring: 'rgba(255,180,40,0.6)', accent: 'rgba(255,200,80,0.6)' },
                    { ring: 'rgba(255,255,255,0.45)', accent: 'rgba(255,255,200,0.5)' },
                    { ring: 'rgba(30,30,30,0.7)', accent: 'rgba(80,80,80,0.5)' },
                    { ring: 'rgba(40,180,40,0.5)', accent: 'rgba(100,220,100,0.5)' },
                    { ring: 'rgba(200,40,40,0.5)', accent: 'rgba(255,100,100,0.5)' },
                    { ring: 'rgba(100,100,100,0.5)', accent: 'rgba(180,180,180,0.5)' }
                ];

                var _checkLib = setInterval(function () {
                    if (typeof s_oSpriteLibrary === 'undefined' || !s_oSpriteLibrary) return;
                    var test = s_oSpriteLibrary.getSprite('fiche_0');
                    if (!test || !test.width) return;
                    clearInterval(_checkLib);

                    for (var i = 0; i < chipStyles.length; i++) {
                        var key = 'fiche_' + i;
                        var orig = s_oSpriteLibrary.getSprite(key);
                        if (!orig) continue;
                        var w = orig.width || 43, h = orig.height || 44;
                        var chipCanvas = _pcDrawGoldChip(Math.max(w, h), chipStyles[i].ring, chipStyles[i].accent);
                        var img = new Image();
                        img.width = w;
                        img.height = h;
                        (function(k, imgRef) {
                            imgRef.onload = function () {
                                try {
                                    var entry = s_oSpriteLibrary.getSprite(k);
                                    if (entry) {
                                        entry.src = imgRef.src;
                                        entry.width = imgRef.width;
                                        entry.height = imgRef.height;
                                    }
                                } catch(e) {}
                            };
                            imgRef.src = chipCanvas.toDataURL('image/png');
                        })(key, img);
                    }
                }, 200);
            }

            function _pcAutoReturnToBetting() {
                if (_pcGamePhase !== 'result') return;
                try {
                    if (typeof s_oGame !== 'undefined' && s_oGame && typeof s_oGame.returnInBetPanel === 'function') {
                        s_oGame.returnInBetPanel();
                        return;
                    }
                    if (typeof s_oMain !== 'undefined' && s_oMain) {
                        s_oMain.gotoBetPanel();
                    }
                } catch (e) {}
            }

            function _pcPatchContinuousPlay() {
                var _checkInterval = setInterval(function () {
                    if (typeof s_oMain === 'undefined' || !s_oMain) return;
                    clearInterval(_checkInterval);

                    var _origGotoMenu = s_oMain.gotoMenu.bind(s_oMain);
                    s_oMain.gotoMenu = function () {
                        if (_pcMenuShown) {
                            s_oMain.gotoBetPanel();
                        } else {
                            _pcMenuShown = true;
                            _origGotoMenu();
                            _pcGamePhase = 'menu';
                            window.parent.postMessage({ type: 'hr:phase', phase: 'menu' }, '*');
                        }
                    };

                    var _origGotoBetPanel = s_oMain.gotoBetPanel.bind(s_oMain);
                    s_oMain.gotoBetPanel = function () {
                        _origGotoBetPanel();
                        _pcGamePhase = 'betting';
                        window.parent.postMessage({ type: 'hr:phase', phase: 'betting' }, '*');
                    };
                }, 100);
            }

            function _pcPatchChipSystem() {
                var _checkInterval = setInterval(function () {
                    if (typeof CHIP_VALUES === 'undefined') return;
                    clearInterval(_checkInterval);

                    window._pcOrigChipValues = CHIP_VALUES.slice();

                    window._pcSetChipValue = function (value) {
                        _pcCustomChipValue = value;
                        if (typeof CHIP_VALUES !== 'undefined' && CHIP_VALUES.length > 0) {
                            CHIP_VALUES[0] = value;
                            if (typeof s_oBetPanel !== 'undefined' && s_oBetPanel) {
                                s_oBetPanel.setChipSelected(0);
                            }
                        }
                    };
                }, 100);

                _pcPatchChipPanelConstructor();
            }

            function _pcPatchChipPanelConstructor() {
                var _checkCtor = setInterval(function () {
                    if (typeof CChipPanel === 'undefined') return;
                    clearInterval(_checkCtor);

                    var _OrigCChipPanel = CChipPanel;
                    CChipPanel = function (x, y, container) {
                        var beforeCount = container.numChildren;
                        _OrigCChipPanel.call(this, x, y, container);
                        try {
                            for (var i = beforeCount; i < container.numChildren; i++) {
                                var panelContainer = container.getChildAt(i);
                                if (!panelContainer || !panelContainer.numChildren) continue;
                                for (var j = 0; j < panelContainer.numChildren; j++) {
                                    var inner = panelContainer.getChildAt(j);
                                    if (!inner) continue;
                                    var isStartBtn = inner.y >= 280 && inner.y <= 340 && inner.numChildren !== undefined;
                                    if (!isStartBtn) {
                                        inner.alpha = 0;
                                        inner.mouseEnabled = false;
                                        if (inner.visible !== undefined) inner.visible = false;
                                    }
                                }
                            }
                        } catch (e) {}
                        return this;
                    };
                    CChipPanel.prototype = _OrigCChipPanel.prototype;
                }, 50);
            }

            function _pcApplyScenery(filter) {
                _pcSceneryFilter = filter;
                var canvas = document.getElementById('canvas');
                if (canvas) {
                    canvas.style.filter = filter;
                    canvas.style.webkitFilter = filter;
                }
            }

            window.addEventListener('message', function (e) {
                if (!e.data || typeof e.data !== 'object') return;
                if (e.source !== window.parent && e.source !== window) return;
                if (e.data.type === 'balance:update' && typeof e.data.balance === 'number') {
                    _pcPrevBalance = e.data.balance;
                    if (typeof s_iCurMoney !== 'undefined') {
                        s_iCurMoney = e.data.balance;
                    }
                }
                if (e.data.type === 'balance' && typeof e.data.balance === 'number') {
                    _pcPrevBalance = e.data.balance;
                    if (typeof s_iCurMoney !== 'undefined') {
                        s_iCurMoney = e.data.balance;
                    }
                    if (typeof s_oBetPanel !== 'undefined' && s_oBetPanel !== null) {
                        s_oBetPanel.setMoney(e.data.balance);
                    }
                }
                if (e.data.type === 'hr:chipSelect' && typeof e.data.value === 'number') {
                    if (window._pcSetChipValue) {
                        window._pcSetChipValue(e.data.value);
                    }
                }
                if (e.data.type === 'hr:scenery' && typeof e.data.filter === 'string') {
                    _pcApplyScenery(e.data.filter);
                }
                if (e.data.type === 'hr:chantMute' && typeof e.data.muted === 'boolean') {
                    if (window._pcCrowdChants) {
                        window._pcCrowdChants.setMuted(e.data.muted);
                    }
                }
                if (e.data.type === 'hr:chantVolume' && typeof e.data.volume === 'number') {
                    if (window._pcCrowdChants) {
                        window._pcCrowdChants.setVolume(e.data.volume);
                    }
                }
                if (e.data.type === 'hr:getPhase') {
                    window.parent.postMessage({ type: 'hr:phase', phase: _pcGamePhase }, '*');
                }
            });

        </script>

        <div class="check-fonts">
            <p class="check-font-1">test 1</p>
            <p class="check-font-2">test 2</p>
            <p class="check-font-3">test 3</p>
        </div>

        <canvas id="canvas" class='ani_hack' width="1216" height="832"> </canvas>
        <div data-orientation="landscape" class="orientation-msg-container"><p class="orientation-msg-text">Please rotate your device</p></div>
        <div id="block_game" style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%; display:none"></div>

        <script src="crowd-chants.js"></script>
        <script src="music-hook.js"></script>
</body>
</html>
