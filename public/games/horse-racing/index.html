<!DOCTYPE html>
<html>
    <head>
        <title>HORSE RACING</title>
        <link rel="stylesheet" href="css/reset.css" type="text/css">
        <link rel="stylesheet" href="css/main.css" type="text/css">
        <link rel="stylesheet" href="css/orientation_utils.css" type="text/css">
        <link rel="stylesheet" href="css/ios_fullscreen.css" type="text/css">
        <link rel='shortcut icon' type='image/x-icon' href='./favicon.ico' />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui" />
        <meta name="msapplication-tap-highlight" content="no"/>

        <script type="text/javascript" src="js/jquery-3.2.1.min.js"></script>
        <script type="text/javascript" src="js/howler.min.js"></script>
        <script type="text/javascript" src="js/createjs-2015.11.26.min.js"></script>
        <script type="text/javascript" src="js/CLang.min.js"></script>
        <script type="text/javascript" src="js/main.js"></script>

    </head>
    <body ondragstart="return false;" ondrop="return false;" >
        <div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
        <script>
            var _pcUrlBalance = parseInt(new URLSearchParams(window.location.search).get('balance'), 10);
            var _pcStartBalance = isNaN(_pcUrlBalance) ? 1000 : _pcUrlBalance;
            var _pcPrevBalance = _pcStartBalance;

            $(document).ready(function () {
                var oMain = new CMain({
                    money: _pcStartBalance,
                    min_bet: 1,
                    max_bet: 100,
                    win_occurrence: 40,
                    game_cash: _pcStartBalance,
                    chip_values: [1, 5, 10, 25, 50, 100],
                    audio_enable_on_startup: false,
                    show_credits: true,
                    fullscreen: true,
                    check_orientation: true,
                    num_levels_for_ads: 2
                });

                $(oMain).on("recharge", function (evt) {
                    window.parent.postMessage({ type: 'getBalance' }, '*');
                    var iMoney = _pcStartBalance;
                    if (typeof s_oBetPanel !== 'undefined' && s_oBetPanel !== null) {
                        s_oBetPanel.setMoney(iMoney);
                    }
                });

                $(oMain).on("start_session", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeStartSession();
                    }
                });

                $(oMain).on("end_session", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeEndSession();
                    }
                });

                $(oMain).on("bet_placed", function (evt, iTotBet) {
                    // Track bets for balance sync
                });

                $(oMain).on("save_score", function (evt, iScore) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeSaveScore({ score: iScore });
                    }
                    var netChange = iScore - _pcPrevBalance;
                    if (netChange > 0) {
                        window.parent.postMessage({ type: 'win', amount: netChange }, '*');
                    } else if (netChange < 0) {
                        window.parent.postMessage({ type: 'bet', amount: Math.abs(netChange) }, '*');
                    }
                    _pcPrevBalance = iScore;
                });

                $(oMain).on("show_interlevel_ad", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeShowInterlevelAD();
                    }
                });

                $(oMain).on("share_event", function (evt, iScore) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeShareEvent({
                            img: TEXT_SHARE_IMAGE,
                            title: TEXT_SHARE_TITLE,
                            msg: TEXT_SHARE_MSG1 + iScore + TEXT_SHARE_MSG2,
                            msg_share: TEXT_SHARE_SHARE1 + iScore + TEXT_SHARE_SHARE1
                        });
                    }
                });

                if (isIOS()) {
                    setTimeout(function () {
                        sizeHandler();
                    }, 200);
                } else {
                    sizeHandler();
                }
            });

            window.addEventListener('message', function (e) {
                if (!e.data || typeof e.data !== 'object') return;
                if (e.data.type === 'balance:update' && typeof e.data.balance === 'number') {
                    _pcPrevBalance = e.data.balance;
                }
                if (e.data.type === 'balance' && typeof e.data.balance === 'number') {
                    _pcPrevBalance = e.data.balance;
                    if (typeof s_oBetPanel !== 'undefined' && s_oBetPanel !== null) {
                        s_oBetPanel.setMoney(e.data.balance);
                    }
                }
            });

        </script>

        <div class="check-fonts">
            <p class="check-font-1">test 1</p>
            <p class="check-font-2">test 2</p>
            <p class="check-font-3">test 3</p>
        </div>

        <canvas id="canvas" class='ani_hack' width="1216" height="832"> </canvas>
        <div data-orientation="landscape" class="orientation-msg-container"><p class="orientation-msg-text">Please rotate your device</p></div>
        <div id="block_game" style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%; display:none"></div>

        <script src="music-hook.js"></script>
</body>
</html>
